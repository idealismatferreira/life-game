/* ---------- áudio simples (WebAudio, sem assets) ---------- */
let AC = null;
function som(tipo) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const n = AC.currentTime;
    const cfg = {
      swing:  { f: 220, f2: 90,  t: "sine",     v: .05, d: .10 },
      hit:    { f: 420, f2: 120, t: "square",   v: .10, d: .09 },
      pesado: { f: 150, f2: 45,  t: "sawtooth", v: .16, d: .20 },
      magia:  { f: 760, f2: 340, t: "triangle", v: .07, d: .12 },
      super:  { f: 190, f2: 55,  t: "sawtooth", v: .20, d: .40 },
      morte:  { f: 320, f2: 70,  t: "square",   v: .09, d: .16 },
      xp:     { f: 880, f2: 1250,t: "sine",     v: .05, d: .08 },
      nivel:  { f: 520, f2: 1050,t: "triangle", v: .12, d: .30 },
      dano:   { f: 200, f2: 80,  t: "square",   v: .12, d: .18 },
    }[tipo];
    if (!cfg) return;
    o.type = cfg.t;
    o.frequency.setValueAtTime(cfg.f, n);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, cfg.f2), n + cfg.d);
    g.gain.setValueAtTime(cfg.v, n);
    g.gain.exponentialRampToValueAtTime(0.0001, n + cfg.d);
    o.start(n); o.stop(n + cfg.d + .02);
  } catch (e) {}
}

/* ---------- inimigos ---------- */
const TIPOS = [
  { nome: "Slime",   cor: "#8ecf5a", r: 16, hp: 42,  vel: 66,  dano: 8,  xp: 3, peso: 5 },
  { nome: "Espinho", cor: "#d98cff", r: 13, hp: 28,  vel: 118, dano: 6,  xp: 4, peso: 3 },
  { nome: "Bloco",   cor: "#ff9c6b", r: 24, hp: 128, vel: 44,  dano: 14, xp: 9, peso: 2 },
];
function sorteiaTipo() {
  const tot = TIPOS.reduce((a, t) => a + t.peso, 0);
  let r = Math.random() * tot;
  for (const t of TIPOS) { r -= t.peso; if (r <= 0) return t; }
  return TIPOS[0];
}
function spawnarChefe(grande) {
  const a = rnd(0, TAU), d = Math.max(W, H) * 0.6 + 90;
  const base = grande
    ? { nome:"Colosso",  r:56, hp:1750, vel:44, dano:26, xp:120, cor:"#ff6b6b" }
    : { nome:"Vigília",  r:38, hp:780,  vel:56, dano:18, xp:60,  cor:"#d98cff" };
  const e = {
    x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d,
    vx:0, vy:0, r:base.r, cor:base.cor, nome:base.nome,
    hp:base.hp, hpMax:base.hp, vel:base.vel, dano:base.dano, xp:base.xp,
    flash:0, atordoado:0, morto:false, squash:0, fase:rnd(0,TAU),
    chefe:true, grande:!!grande, pulso:0,
  };
  inimigos.push(e);
  FASE.chefe = e;
  FASE.aviso = 2.6;
  FASE.avisoTxt = grande ? "⚠  CHEFE FINAL" : "⚠  MINI-CHEFE";
  G.shake = 12;
  som("super");
  efeitos.push({ tipo:"flash", vida:.2, max:.2 });
  return e;
}

function atualizarFases(dt) {
  if (FASE.aviso > 0) FASE.aviso -= dt;

  /* chefe morreu? */
  if (FASE.chefe && FASE.chefe.morto) {
    const eraGrande = FASE.chefe.grande;
    FASE.chefe = null;
    if (eraGrande) {
      FASE.vitoria = true; G.over = true;
      G.shake = 20;
      efeitos.push({ tipo:"flash", vida:.3, max:.3 });
      if (typeof fimDeRun === "function") fimDeRun();
      return;
    }
    /* pós mini-chefe: a horda cresce */
    FASE.n = 2;
    FASE.multSpawn = AUMENTO_POS_MINICHEFE;
    FASE.tetoInimigos = TETO_POS_MINICHEFE;
    FASE.proximoEvento = G.run + 50;
    FASE.aviso = 2.6;
    FASE.avisoTxt = "a horda aumenta!";
    efeitos.push({ tipo:"anel", x:p.x, y:p.y, r:20, rMax:400, vida:.6, max:.6, cor:"#ff9c6b", grosso:true });
    G.shake = 10;
  }

  /* hora do próximo chefe */
  if (!FASE.chefe && !FASE.vitoria && G.run >= FASE.proximoEvento) {
    if (FASE.n === 1) spawnarChefe(false);
    else if (FASE.n === 2) { FASE.n = 3; spawnarChefe(true); }
  }
}

function spawnar() {
  const t = sorteiaTipo();
  // nasce fora da tela, em volta do jogador
  const a = rnd(0, TAU), d = Math.max(W, H) * 0.62 + rnd(40, 140);
  const esc = 1 + G.run * 0.02;
  inimigos.push({
    x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d,
    vx: 0, vy: 0, r: t.r, cor: t.cor, nome: t.nome,
    hp: t.hp * esc, hpMax: t.hp * esc, vel: t.vel, dano: t.dano, xp: t.xp,
    flash: 0, atordoado: 0, morto: false, squash: 0, fase: rnd(0, TAU),
  });
}

/* ---------- dano ---------- */
function bater(e, dano, ang, knock, armaId) {
  if (e.chefe) knock *= e.grande ? 0.10 : 0.18;   // chefes quase não recuam
  // multiplicadores da progressão
  if (typeof multDano === "function") dano = dano * multDano(armaId || p.arma);
  if (typeof META !== "undefined") {
    if (META.mod.sobrecarga) { META.contadorAtaque++; if (META.contadorAtaque % 5 === 0) dano *= 3; }
    if (META.mod.gelo) { e.lento = 1.2; }
    if (META.mod.veneno) { e.veneno = 3; e.venenoDano = dano * 0.12; }
    if (META.mod.juizo && e.hp - dano <= e.hpMax * 0.15) dano = e.hp;
    registrarDano(armaId || p.arma, Math.min(dano, e.hp));
  }
  e.hp -= dano;
  e.flash = 0.12;
  e.squash = 1;
  e.vx += Math.cos(ang) * knock;
  e.vy += Math.sin(ang) * knock;
  numeros.push({ x: e.x, y: e.y - e.r, vy: -60, txt: Math.round(dano), vida: .6, max: .6, crit: dano > 50 });
  for (let i = 0; i < (dano > 50 ? 12 : 6); i++) {
    const a = ang + rnd(-.9, .9), v = rnd(90, 300);
    particulas.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(1.5, 4), vida: rnd(.2, .5), max: .5, cor: e.cor });
  }
  if (e.hp <= 0 && !e.morto) matar(e);
}
function matar(e) {
  e.morto = true;
  G.kills++;
  som("morte");
  if (typeof META !== "undefined") {
    META.matouRecente++;
    if (META.mod.sanguessuga) p.hp = Math.min(p.hpMax, p.hp + 2);
    if (META.mod.estilhaco) {
      efeitos.push({ tipo:"onda", x:e.x, y:e.y, r:6, rMax:70, vida:.25, max:.25, cor:"#ff9c6b" });
      for (const o of inimigos) {
        if (o === e || o.morto) continue;
        if (dist2(o, e) < 70*70) { o.hp -= 18; o.flash = .1;
          if (o.hp <= 0 && !o.morto) matar(o); }
      }
    }
  }
  for (let i = 0; i < 16; i++) {
    const a = rnd(0, TAU), v = rnd(60, 340);
    particulas.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(2, 5), vida: rnd(.25, .6), max: .6, cor: e.cor });
  }
  efeitos.push({ tipo: "onda", x: e.x, y: e.y, r: e.r, rMax: e.r * 2.8, vida: .22, max: .22, cor: e.cor });
  const n = e.xp > 6 ? 3 : e.xp > 3 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    orbes.push({ x: e.x + rnd(-10, 10), y: e.y + rnd(-10, 10), vx: rnd(-70, 70), vy: rnd(-70, 70), r: 5, xp: Math.ceil(e.xp / n), vida: 14 });
  }
}

/* ---------- controles: joystick virtual ---------- */
const joy = { on: false, id: null, bx: 0, by: 0, x: 0, y: 0, dx: 0, dy: 0, raio: 58 };
function ponto(t) { return { x: t.clientX, y: t.clientY }; }

cv.addEventListener("pointerdown", (ev) => {
  const q = ponto(ev);
  if (typeof HUB !== "undefined" && HUB.aberto) { hubDown(q); return; }
  // telas modais têm prioridade
  if (typeof META !== "undefined") {
    if (META.pausa && META.cartas.length) {
      for (let i = 0; i < META.cartas.length; i++) {
        const a = areaCarta(i);
        if (q.x >= a.x && q.x <= a.x + a.w && q.y >= a.y && q.y <= a.y + a.h) { escolherCarta(i); return; }
      }
      return;
    }
    if (G.over && META.evolucaoPendente) {
      const ops = META.evolucaoPendente.opcoes;
      for (let i = 0; i < ops.length; i++) {
        const a = areaCarta(i);
        if (q.x >= a.x && q.x <= a.x + a.w && q.y >= a.y && q.y <= a.y + a.h) { confirmarEvolucao(ops[i].id); return; }
      }
      return;
    }
  }
  if (G.over) {
    if (q.y < H * .25) { HUB.aberto = true; HUB.aba = 0; HUB.scroll = 0; return; }
    reiniciar(); return;
  }
  if (btnSuper(q)) { if (p.superCd <= 0) { SUPER.usar(p); p.superCd = SUPER.cdMax; } return; }
  const a = btnArma(q); if (a !== -1) { trocarArma(a); return; }
  if (!joy.on) {
    joy.on = true; joy.id = ev.pointerId;
    joy.bx = q.x; joy.by = q.y; joy.x = q.x; joy.y = q.y;
  }
});
cv.addEventListener("pointermove", (ev) => {
  if (typeof HUB !== "undefined" && HUB.aberto) { hubMove(ponto(ev)); return; }
  if (!joy.on || ev.pointerId !== joy.id) return;
  const q = ponto(ev);
  joy.x = q.x; joy.y = q.y;
});
function soltarJoy(ev) {
  if (typeof HUB !== "undefined" && HUB.aberto) { hubUp(ponto(ev)); return; }
  if (joy.on && ev.pointerId === joy.id) { joy.on = false; joy.dx = 0; joy.dy = 0; }
}
cv.addEventListener("pointerup", soltarJoy);
cv.addEventListener("pointercancel", soltarJoy);

// teclado (pra testar no desktop)
const teclas = {};
addEventListener("keydown", e => {
  teclas[e.key.toLowerCase()] = true;
  if (e.key === " ") { if (p.superCd <= 0) { SUPER.usar(p); p.superCd = SUPER.cdMax; } }
  const emPausa = (typeof META !== "undefined") && (META.pausa || (G.over && META.evolucaoPendente));
  if (emPausa) {
    const i = ["1","2","3"].indexOf(e.key);
    if (i >= 0) {
      if (META.pausa) escolherCarta(i);
      else if (META.evolucaoPendente && META.evolucaoPendente.opcoes[i]) confirmarEvolucao(META.evolucaoPendente.opcoes[i].id);
    }
    return;
  }
  if (e.key === "1") trocarArma(0);
  if (e.key === "2") trocarArma(1);
  if (e.key === "3") trocarArma(2);
  if (G.over && e.key === "Enter") reiniciar();
});
addEventListener("keyup", e => { teclas[e.key.toLowerCase()] = false; });

function nomeArma(id) {
  if (typeof META !== "undefined" && META.save) { const a = P.armaAtual(META.save, id); return a; }
  return ARMAS[id];
}
function trocarArma(i) {
  const nova = ORDEM_ARMAS[i];
  if (!nova || nova === p.arma) return;
  p.arma = nova; p.cd = 0.12;
  efeitos.push({ tipo: "anel", x: p.x, y: p.y, r: 18, rMax: 46, vida: .25, max: .25, cor: ARMAS[nova].cor });
  som("xp");
}

/* botões na tela (posições calculadas no desenho) */
function posSuper() { return { x: W - 66, y: H - 96, r: 38 }; }
function posArma(i) { const base = W - 66 - 3 * 52; return { x: base + i * 52 + 26, y: H - 42, r: 22 }; }
function btnSuper(q) { const b = posSuper(); return Math.hypot(q.x - b.x, q.y - b.y) < b.r + 8; }
function btnArma(q) {
  for (let i = 0; i < ORDEM_ARMAS.length; i++) {
    const b = posArma(i);
    if (Math.hypot(q.x - b.x, q.y - b.y) < b.r + 8) return i;
  }
  return -1;
}

/* ---------- update ---------- */
let spawnT = 0;
function update(dt) {
  G.run += dt;

  /* movimento */
  let mx = 0, my = 0;
  if (joy.on) {
    let dx = joy.x - joy.bx, dy = joy.y - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > 6) {
      const k = Math.min(d, joy.raio) / joy.raio;
      mx = (dx / d) * k; my = (dy / d) * k;
    }
  }
  if (teclas["arrowup"] || teclas["w"]) my = -1;
  if (teclas["arrowdown"] || teclas["s"]) my = 1;
  if (teclas["arrowleft"] || teclas["a"]) mx = -1;
  if (teclas["arrowright"] || teclas["d"]) mx = 1;
  const m = Math.hypot(mx, my);
  if (m > 1) { mx /= m; my /= m; }

  const velMult = (typeof multVelocidade === 'function') ? multVelocidade() : 1;
  const alvoVx = mx * p.vel * velMult, alvoVy = my * p.vel * velMult;
  // aceleração/atrito: dá peso sem ficar escorregadio
  p.vx = lerp(p.vx, alvoVx, 1 - Math.pow(0.001, dt));
  p.vy = lerp(p.vy, alvoVy, 1 - Math.pow(0.001, dt));
  if (p.recuo > 0) { p.recuo -= dt; p.vx -= Math.cos(p.mira) * 240 * dt * 3; p.vy -= Math.sin(p.mira) * 240 * dt * 3; }
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (m > 0.1) p.passo += dt * 12;
  p.trilha = p.trilha || [];
  p.trilhaT = (p.trilhaT || 0) + dt;
  if (p.trilhaT > .045) { p.trilhaT = 0; p.trilha.push({x:p.x, y:p.y});
    if (p.trilha.length > 12) p.trilha.shift(); }
  p.lean = lerp(p.lean, mx * 0.25, dt * 10);

  /* mira: inimigo vivo mais próximo (auto-aim) */
  let alvo = null, melhor = Infinity;
  for (const e of inimigos) {
    if (e.morto) continue;
    let d = dist2(e, p);
    // chefes têm prioridade: contam como se estivessem bem mais perto
    if (e.chefe) d *= 0.16;
    if (d < melhor) { melhor = d; alvo = e; }
  }
  // distância real do alvo (para checar alcance da arma)
  if (alvo) melhor = dist2(alvo, p);
  if (alvo) {
    const ang = Math.atan2(alvo.y - p.y, alvo.x - p.x);
    let da = ang - p.mira;
    while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    p.mira += da * Math.min(1, dt * 14);   // vira suave, não teleporta
  } else if (m > 0.1) {
    p.mira = Math.atan2(my, mx);
  }

  /* ataque automático */
  const arma = ARMAS[p.arma];
  p.cd -= dt;
  if (p.cd <= 0 && alvo) {
    const alcanceOk = arma.alcance ? melhor < Math.pow(arma.alcance + 40, 2) : melhor < Math.pow(520, 2);
    if (alcanceOk) { arma.atacar(p); p.cd = arma.cd / ((typeof multCadencia==='function')?multCadencia():1);
      if (typeof META !== 'undefined' && META.mod.eco && Math.random() < 0.2) p.cd *= 0.15; }
  }
  if (p.superCd > 0) p.superCd -= dt;
  if (p.inv > 0) p.inv -= dt;

  /* spawn crescente */
  atualizarFases(dt);
  spawnT -= dt;
  let ritmo = Math.max(0.28, 1.10 - G.run * 0.010) / FASE.multSpawn;
  if (FASE.chefe) ritmo *= 2.2;          // durante o chefe, menos gente pra dar foco
  if (spawnT <= 0 && inimigos.length < FASE.tetoInimigos) { spawnar(); spawnT = ritmo; }

  /* inimigos */
  for (const e of inimigos) {
    if (e.morto) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.squash > 0) e.squash -= dt * 4;
    if (e.congelado > 0) { e.congelado -= dt; e.vx *= .05; e.vy *= .05; }
    else if (e.atordoado > 0) { e.atordoado -= dt; }
    else {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      e.vx = lerp(e.vx, Math.cos(a) * e.vel, dt * 3);
      e.vy = lerp(e.vy, Math.sin(a) * e.vel, dt * 3);
    }
    if (e.lento > 0) { e.lento -= dt; e.vx *= 0.55; e.vy *= 0.55; }
    if (e.veneno > 0) { e.veneno -= dt; e.hp -= (e.venenoDano || 3) * dt;
      if (Math.random() < dt*6) particulas.push({x:e.x+rnd(-6,6),y:e.y,vx:0,vy:-30,r:2,vida:.4,max:.4,cor:"#9cff8a"});
      if (e.hp <= 0 && !e.morto) matar(e); }
    if (typeof META !== "undefined" && META.mod.tempo) {
      const dd = Math.hypot(e.x-p.x, e.y-p.y);
      if (dd < 200) { e.vx *= 0.7; e.vy *= 0.7; }
    }
    e.vx *= Math.pow(0.02, dt); e.vy *= Math.pow(0.02, dt);   // atrito do knockback
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.fase += dt * 6;

    // separação simples pra não empilhar tudo num ponto
    for (const o of inimigos) {
      if (o === e || o.morto) continue;
      const dx = e.x - o.x, dy = e.y - o.y, dd = Math.hypot(dx, dy), min = e.r + o.r;
      if (dd > 0 && dd < min) {
        const f = (min - dd) / min * 130 * dt;
        e.x += (dx / dd) * f; e.y += (dy / dd) * f;
      }
    }

    // dano no jogador
    if (p.inv <= 0 && dist2(e, p) < Math.pow(e.r + p.r, 2)) {
      let dmg = e.dano;
      if (typeof EXTRAS !== "undefined" && EXTRAS.reducaoDano > 0) dmg *= (1 - EXTRAS.reducaoDano);
      if (typeof META !== "undefined") {
        if (META.escudo > 0) { const abs = Math.min(META.escudo, dmg); META.escudo -= abs; dmg -= abs; META.escudoT = 0; }
        if (META.mod.espinhos) { e.hp -= 22; e.flash = .12; if (e.hp<=0 && !e.morto) matar(e); }
      }
      p.hp -= dmg; p.inv = 0.7;
      G.shake = Math.max(G.shake, 7); G.hitstop = Math.max(G.hitstop, .06);
      som("dano");
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      p.vx += Math.cos(a) * 300; p.vy += Math.sin(a) * 300;
      e.vx -= Math.cos(a) * 200; e.vy -= Math.sin(a) * 200;
      if (p.hp <= 0) { p.hp = 0; G.over = true; if (typeof fimDeRun === 'function') fimDeRun(); }
    }
  }
  inimigos = inimigos.filter(e => !e.morto);

  /* projéteis */
  for (const b of projeteis) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.vida -= dt;
    for (const e of inimigos) {
      if (e.morto || b.atingidos.includes(e)) continue;
      if (dist2(b, e) < Math.pow(b.r + e.r, 2)) {
        bater(e, b.dano, Math.atan2(b.vy, b.vx), b.knock, 'varinha');
        if (typeof aoProjetilAcertar === 'function') aoProjetilAcertar(b, e);
        b.atingidos.push(e);
        b.perfura--;
        G.shake = Math.max(G.shake, b.arma.shake);
        G.hitstop = Math.max(G.hitstop, b.arma.hitstop);
        if (b.perfura <= 0) b.vida = 0;
        break;
      }
    }
  }
  projeteis = projeteis.filter(b => b.vida > 0);

  /* orbes de XP com ímã */
  for (const o of orbes) {
    o.vida -= dt;
    const d = Math.hypot(p.x - o.x, p.y - o.y);
    const raioC = p.raioColeta || 130;
    if (d < raioC) {
      const f = (1 - d / raioC) * 1500;
      const a = Math.atan2(p.y - o.y, p.x - o.x);
      o.vx += Math.cos(a) * f * dt; o.vy += Math.sin(a) * f * dt;
    }
    o.vx *= Math.pow(0.15, dt); o.vy *= Math.pow(0.15, dt);
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (d < p.r + 8) {
      o.vida = 0;
      p.xp += o.xp * (typeof META !== "undefined" && META.mod.colheita ? 2 : 1);
      som("xp");
      if (typeof META !== "undefined" && META.mod.orbeVoraz) {
        efeitos.push({ tipo:"onda", x:p.x, y:p.y, r:8, rMax:90, vida:.22, max:.22, cor:"#7fd858" });
        for (const q of inimigos) { if (!q.morto && dist2(q,p) < 90*90) { q.hp -= 12; q.flash=.1;
          if (q.hp<=0 && !q.morto) matar(q); } }
      }
      if (p.xp >= p.xpProx) {
        p.xp -= p.xpProx; p.nivel++; p.xpProx = Math.round(p.xpProx * 1.45);
        p.hpMax += 8; p.hp = Math.min(p.hpMax, p.hp + 18);
        efeitos.push({ tipo: "anel", x: p.x, y: p.y, r: 20, rMax: 120, vida: .45, max: .45, cor: "#ffe08a", grosso: true });
        G.shake = Math.max(G.shake, 4);
        som("nivel");
        if (typeof aoSubirNivel === "function") aoSubirNivel();
      }
    }
  }
  orbes = orbes.filter(o => o.vida > 0);

  /* partículas, números, efeitos */
  for (const q of particulas) {
    q.vida -= dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= Math.pow(0.08, dt); q.vy *= Math.pow(0.08, dt);
  }
  particulas = particulas.filter(q => q.vida > 0);

  for (const n of numeros) { n.vida -= dt; n.y += n.vy * dt; n.vy += 130 * dt; }
  numeros = numeros.filter(n => n.vida > 0);

  for (const f of efeitos) f.vida -= dt;
  efeitos = efeitos.filter(f => f.vida > 0);

  /* superpoderes contínuos (torres, drones, auras, dash) */
  if (typeof atualizarAtivos === "function") atualizarAtivos(dt);
  if (typeof atualizarExtras === "function") atualizarExtras(dt);

  /* meta: escudo regenera, frenesi decai */
  if (typeof META !== "undefined") {
    if (META.escudoMax > 0) {
      META.escudoT += dt;
      if (META.escudoT > 4 && META.escudo < META.escudoMax) META.escudo = Math.min(META.escudoMax, META.escudo + 14 * dt);
    }
    META.matouRecente = Math.max(0, META.matouRecente - dt * 1.2);
  }

  /* câmera segue com folga */
  cam.x = lerp(cam.x, p.x, 1 - Math.pow(0.0001, dt));
  cam.y = lerp(cam.y, p.y, 1 - Math.pow(0.0001, dt));

  /* shake decai */
  if (G.shake > 0) {
    G.shake = Math.max(0, G.shake - dt * 34);
    G.shakeX = rnd(-G.shake, G.shake);
    G.shakeY = rnd(-G.shake, G.shake);
  } else { G.shakeX = 0; G.shakeY = 0; }
}

/* ---------- desenho ---------- */
function grade() {
  const s = 64;
  const ox = -((cam.x % s) + s) % s, oy = -((cam.y % s) + s) % s;
  ctx.strokeStyle = "rgba(255,255,255,.035)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x < W + s; x += s) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy; y < H + s; y += s) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function desenhar() {
  ctx.fillStyle = "#0d1210";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2 - cam.x + G.shakeX, H / 2 - cam.y + G.shakeY);

  grade();

  // orbes de XP
  for (const o of orbes) {
    const pulso = 1 + Math.sin(G.t * 8 + o.x) * .18;
    ctx.fillStyle = "#7fd858";
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * pulso, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(127,216,88,.25)";
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 2.4 * pulso, 0, TAU); ctx.fill();
  }

  // efeitos atrás
  for (const f of efeitos) {
    const k = f.vida / f.max;
    if (f.tipo === "onda" || f.tipo === "anel") {
      const r = lerp(f.r, f.rMax, 1 - k);
      ctx.strokeStyle = f.cor; ctx.globalAlpha = k * .85;
      ctx.lineWidth = f.grosso ? 7 * k : 3.5 * k;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  if (typeof desenharAtivos === "function") desenharAtivos();
  if (typeof desenharExtras === "function") desenharExtras();

  // inimigos
  for (const e of inimigos) {
    const sq = 1 + Math.max(0, e.squash) * .35;
    const bob = Math.sin(e.fase) * 2;
    ctx.save();
    ctx.translate(e.x, e.y + bob);
    ctx.scale(1 / sq, sq);
    ctx.fillStyle = e.flash > 0 ? "#fff" : e.cor;
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    // olhinhos (dá personalidade barata)
    if (e.flash <= 0) {
      ctx.fillStyle = "#101410";
      const dx = Math.cos(Math.atan2(p.y - e.y, p.x - e.x)) * e.r * .22;
      const dy = Math.sin(Math.atan2(p.y - e.y, p.x - e.x)) * e.r * .22;
      ctx.beginPath(); ctx.arc(dx - e.r * .3, dy - e.r * .12, e.r * .13, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(dx + e.r * .3, dy - e.r * .12, e.r * .13, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // barra de vida
    if (e.hp < e.hpMax) {
      const w = e.r * 2, h = 4;
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w, h);
      ctx.fillStyle = "#ff6b6b";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w * clamp(e.hp / e.hpMax, 0, 1), h);
    }
    if (e.chefe) {
      ctx.strokeStyle = e.cor; ctx.lineWidth = 2;
      ctx.globalAlpha = .5 + Math.sin(G.t * 5) * .25;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (e.atordoado > 0) {
      ctx.fillStyle = "#ffe08a";
      ctx.font = "12px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("✦", e.x, e.y - e.r - 15);
    }
  }

  // projéteis
  for (const b of projeteis) {
    ctx.fillStyle = b.cor;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = .3;
    ctx.beginPath(); ctx.arc(b.x - b.vx * .012, b.y - b.vy * .012, b.r * 1.7, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // jogador
  // rastro
  if (typeof rastroDoJogador === "function" && p.trilha) {
    const rst = rastroDoJogador();
    if (rst !== "nenhum") {
      const corP = corDoJogador(G.t);
      p.trilha.forEach((t, i) => {
        const k = i / p.trilha.length;
        ctx.globalAlpha = k * (rst === "eco" ? .45 : .3);
        ctx.fillStyle = rst === "faisca" ? "#ffe08a" : corP;
        if (rst === "eco") { ctx.fillStyle = corP; desenharForma(t.x, t.y, p.r * k, formaDoJogador()); }
        else { ctx.beginPath(); ctx.arc(t.x, t.y, (rst==="faisca"?3:5) * k, 0, TAU); ctx.fill(); }
      });
      ctx.globalAlpha = 1;
    }
  }

  const piscando = p.inv > 0 && Math.floor(G.t * 22) % 2 === 0;
  if (!piscando) {
    const bob = Math.sin(p.passo) * 2.5;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.rotate(p.lean);
    ctx.fillStyle = (typeof corDoJogador === "function") ? corDoJogador(G.t) : "#eaf6ff";
    if (typeof desenharForma === "function") desenharForma(0, 0, p.r, formaDoJogador());
    else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill(); }
    ctx.restore();
    // indicador da arma na direção da mira
    const arma = ARMAS[p.arma];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.mira);
    ctx.fillStyle = arma.cor;
    ctx.fillRect(p.r - 2, -3, 16, 6);
    ctx.restore();
  }

  // arcos de ataque (na frente)
  for (const f of efeitos) {
    if (f.tipo !== "arco") continue;
    const k = f.vida / f.max;
    ctx.strokeStyle = f.cor; ctx.globalAlpha = k * .9;
    ctx.lineWidth = (f.grosso ? 16 : 9) * k;
    ctx.lineCap = "round";
    const varre = lerp(-f.arco / 2, f.arco / 2, 1 - k);
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * .72, f.ang - f.arco / 2, f.ang + varre);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineCap = "butt";
  }

  // partículas
  for (const q of particulas) {
    ctx.globalAlpha = clamp(q.vida / q.max, 0, 1);
    ctx.fillStyle = q.cor;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // números de dano
  for (const n of numeros) {
    const k = clamp(n.vida / n.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = n.crit ? "#ffcf6b" : "#fff";
    ctx.font = `bold ${n.crit ? 22 : 16}px Sora, sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(n.txt, n.x, n.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // flash de tela
  for (const f of efeitos) {
    if (f.tipo !== "flash") continue;
    ctx.fillStyle = `rgba(255,255,255,${(f.vida / f.max) * .5})`;
    ctx.fillRect(0, 0, W, H);
  }

  hud();
}

function hud() {
  // vida
  const bw = W - 32, bh = 12;
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillRect(16, 14, bw, bh);
  ctx.fillStyle = p.hp / p.hpMax < .3 ? "#ff6b6b" : "#7fd858";
  ctx.fillRect(16, 14, bw * clamp(p.hp / p.hpMax, 0, 1), bh);
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1;
  ctx.strokeRect(16, 14, bw, bh);

  // xp
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillRect(16, 30, bw, 6);
  ctx.fillStyle = "#8be9ff";
  ctx.fillRect(16, 30, bw * clamp(p.xp / p.xpProx, 0, 1), 6);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px Sora, sans-serif"; ctx.textAlign = "left";
  ctx.fillText(`Nv ${p.nivel}`, 16, 54);
  ctx.textAlign = "center";
  const restante = FASE.chefe ? null : Math.max(0, Math.ceil(FASE.proximoEvento - G.run));
  ctx.fillText(restante !== null ? `${Math.floor(G.run)}s  ·  próximo em ${restante}s` : `${Math.floor(G.run)}s`, W / 2, 54);
  ctx.textAlign = "right";
  ctx.fillText(`${G.kills} ☠`, W - 16, 54);

  // barra do chefe
  if (FASE.chefe && !FASE.chefe.morto) {
    const c = FASE.chefe, bw2 = W - 60;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(30, 92, bw2, 14);
    ctx.fillStyle = c.cor;
    ctx.fillRect(30, 92, bw2 * clamp(c.hp / c.hpMax, 0, 1), 14);
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1;
    ctx.strokeRect(30, 92, bw2, 14);
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px Sora, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(c.nome.toUpperCase(), W / 2, 103);
  }

  // aviso de fase
  if (FASE.aviso > 0) {
    ctx.globalAlpha = Math.min(1, FASE.aviso);
    ctx.textAlign = "center";
    ctx.fillStyle = FASE.n >= 3 ? "#ff6b6b" : "#ffcf6b";
    ctx.font = "bold 26px Sora, sans-serif";
    ctx.fillText(FASE.avisoTxt, W / 2, H * .42);
    ctx.globalAlpha = 1;
  }

  // joystick
  if (joy.on) {
    let dx = joy.x - joy.bx, dy = joy.y - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.raio) { dx = dx / d * joy.raio; dy = dy / d * joy.raio; }
    ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.raio, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.30)";
    ctx.beginPath(); ctx.arc(joy.bx + dx, joy.by + dy, 26, 0, TAU); ctx.fill();
  }

  // botão super
  const b = posSuper();
  const pronto = p.superCd <= 0;
  ctx.fillStyle = pronto ? "rgba(255,224,138,.28)" : "rgba(255,255,255,.08)";
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = pronto ? "#ffe08a" : "rgba(255,255,255,.2)";
  ctx.lineWidth = pronto ? 3 : 2;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
  if (!pronto) {
    ctx.strokeStyle = "#ffe08a"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - p.superCd / SUPER.cdMax));
    ctx.stroke();
  }
  ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha = pronto ? 1 : .45;
  ctx.fillText((typeof superAtual === "function") ? superAtual().icone : SUPER.icone, b.x, b.y + 1);
  ctx.globalAlpha = 1;

  // botões de arma
  ORDEM_ARMAS.forEach((k, i) => {
    const q = posArma(i), sel = p.arma === k;
    ctx.fillStyle = sel ? "rgba(255,255,255,.22)" : "rgba(255,255,255,.07)";
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = sel ? ARMAS[k].cor : "rgba(255,255,255,.16)";
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.stroke();
    ctx.font = "17px sans-serif";
    ctx.globalAlpha = sel ? 1 : .55;
    ctx.fillText(nomeArma(k).icone, q.x, q.y + 1);
    ctx.globalAlpha = 1;
  });
  ctx.textBaseline = "alphabetic";

  // nome da arma atual
  const infoArma = nomeArma(p.arma);
  ctx.fillStyle = ARMAS[p.arma].cor;
  ctx.font = "bold 12px Sora, sans-serif"; ctx.textAlign = "right";
  ctx.fillText(`${infoArma.nome} · ${infoArma.desc}`, W - 16, H - 76);

  // modificadores ativos (ícones no canto)
  if (typeof META !== "undefined" && META.modAtivos.length) {
    ctx.font = "15px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    META.modAtivos.forEach((id, i) => {
      const m = P.MODIFICADORES.find(x => x.id === id);
      if (!m) return;
      const col = i % 6, lin = Math.floor(i / 6);
      ctx.globalAlpha = .85;
      ctx.fillText(m.icone, 16 + col * 24, 76 + lin * 24);
      ctx.globalAlpha = 1;
    });
    ctx.textBaseline = "alphabetic";
  }

  // escudo
  if (typeof META !== "undefined" && META.escudoMax > 0 && META.escudo > 0) {
    ctx.fillStyle = "#8be9ff";
    ctx.fillRect(16, 40, (W - 32) * (META.escudo / META.escudoMax) * .4, 4);
  }

  // ——— telas modais ———
  if (typeof META !== "undefined") {
    if (META.pausa && META.cartas.length) { telaCartas(); return; }
    if (G.over && META.evolucaoPendente) { telaEvolucao(); return; }
  }

  // game over
  if (G.over) {
    ctx.fillStyle = "rgba(8,10,9,.88)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = FASE.vitoria ? "#7fd858" : "#fff";
    ctx.font = "bold 30px Sora, sans-serif";
    ctx.fillText(FASE.vitoria ? "🏆 VITÓRIA" : "fim da run", W / 2, H * .3);
    ctx.font = "15px Sora, sans-serif";
    ctx.fillStyle = "#9db8a4";
    ctx.fillText(`${Math.floor(G.run)}s · nível ${p.nivel} · ${G.kills} derrotados`, W / 2, H * .3 + 30);

    if (typeof META !== "undefined" && META.save) {
      // fragmentos ganhos
      ctx.fillStyle = "#ffcf6b"; ctx.font = "bold 17px Sora, sans-serif";
      ctx.fillText(`+${META.ultimoFrag || 0} 💎  (total ${META.save.fragmentos})`, W / 2, H * .3 + 62);

      // barras de maestria
      let y = H * .46;
      ctx.font = "12px Sora, sans-serif";
      for (const arma of ["espada", "varinha", "martelo"]) {
        const est = P.estadoArma(META.save, arma);
        const at = P.armaAtual(META.save, arma);
        const bw = W - 80;
        ctx.textAlign = "left";
        ctx.fillStyle = "#cfe0d2";
        ctx.fillText(`${at.icone} ${at.nome}`, 40, y - 6);
        ctx.textAlign = "right";
        ctx.fillStyle = "#7d8f7f";
        ctx.fillText(est.prox ? `T${est.tier} · ${Math.round(est.maestria)}/${est.prox}` : `T3 máx`, W - 40, y - 6);
        ctx.fillStyle = "rgba(255,255,255,.09)";
        ctx.fillRect(40, y, bw, 6);
        ctx.fillStyle = est.tier === 3 ? "#ffcf6b" : "#7fd858";
        ctx.fillRect(40, y, bw * est.pct, 6);
        y += 34;
      }
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "#7fd858";
    ctx.font = "bold 16px Sora, sans-serif";
    ctx.fillText("toque para jogar de novo", W / 2, H * .82);
    ctx.fillStyle = "#7d8f7f"; ctx.font = "13px Sora, sans-serif";
    ctx.fillText("toque no topo para voltar ao menu", W / 2, H * .88);
  }
}

/* ——— tela de escolha de upgrade (3 cartas) ——— */
function areaCarta(i) {
  const larg = Math.min(W - 44, 360), alt = 108, gap = 14;
  const totalH = 3 * alt + 2 * gap;
  const y0 = (H - totalH) / 2 + 24;
  return { x: (W - larg) / 2, y: y0 + i * (alt + gap), w: larg, h: alt };
}
function telaCartas() {
  ctx.fillStyle = "rgba(8,10,9,.92)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffe08a";
  ctx.font = "bold 22px Sora, sans-serif";
  ctx.fillText(`Nível ${p.nivel}`, W / 2, areaCarta(0).y - 44);
  ctx.fillStyle = "#9db8a4"; ctx.font = "13px Sora, sans-serif";
  ctx.fillText("escolha uma melhoria", W / 2, areaCarta(0).y - 22);

  META.cartas.forEach((c, i) => {
    const a = areaCarta(i);
    const raro = c.raro === 1;
    ctx.fillStyle = raro ? "rgba(201,167,255,.12)" : "rgba(255,255,255,.06)";
    ctx.beginPath(); ctx.roundRect(a.x, a.y, a.w, a.h, 14); ctx.fill();
    ctx.strokeStyle = raro ? "#c9a7ff" : "rgba(255,255,255,.18)";
    ctx.lineWidth = raro ? 2 : 1.2;
    ctx.beginPath(); ctx.roundRect(a.x, a.y, a.w, a.h, 14); ctx.stroke();

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "34px sans-serif";
    ctx.fillText(c.icone, a.x + 18, a.y + a.h / 2);
    ctx.font = "bold 17px Sora, sans-serif";
    ctx.fillStyle = raro ? "#c9a7ff" : "#fff";
    ctx.fillText(c.nome, a.x + 68, a.y + 36);
    ctx.font = "13px Sora, sans-serif";
    ctx.fillStyle = "#9db8a4";
    quebrarTexto(c.desc, a.x + 68, a.y + 62, a.w - 84, 17);
    if (raro) {
      ctx.textAlign = "right"; ctx.fillStyle = "#c9a7ff"; ctx.font = "10px Sora, sans-serif";
      ctx.fillText("RARO", a.x + a.w - 14, a.y + 18);
    }
    ctx.textBaseline = "alphabetic";
  });
}
function quebrarTexto(txt, x, y, larg, lh) {
  const palavras = String(txt).split(" ");
  let linha = "", ly = y;
  for (const w of palavras) {
    const teste = linha ? linha + " " + w : w;
    if (ctx.measureText(teste).width > larg && linha) { ctx.fillText(linha, x, ly); linha = w; ly += lh; }
    else linha = teste;
  }
  if (linha) ctx.fillText(linha, x, ly);
}

/* ——— tela de evolução de arma ——— */
function telaEvolucao() {
  const ev = META.evolucaoPendente;
  ctx.fillStyle = "rgba(6,8,7,.95)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffcf6b";
  ctx.font = "bold 13px Sora, sans-serif";
  ctx.fillText(ev.tipo === "ramo" ? "EVOLUÇÃO DE ARMA" : "FORMA FINAL", W / 2, areaCarta(0).y - 66);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 21px Sora, sans-serif";
  const at = P.armaAtual(META.save, ev.arma);
  ctx.fillText(`${at.icone} ${at.nome}`, W / 2, areaCarta(0).y - 40);
  ctx.fillStyle = "#9db8a4"; ctx.font = "13px Sora, sans-serif";
  ctx.fillText("escolha um caminho — é permanente", W / 2, areaCarta(0).y - 18);

  ev.opcoes.forEach((o, i) => {
    const a = areaCarta(i);
    ctx.fillStyle = "rgba(255,207,107,.10)";
    ctx.beginPath(); ctx.roundRect(a.x, a.y, a.w, a.h, 14); ctx.fill();
    ctx.strokeStyle = "#ffcf6b"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.roundRect(a.x, a.y, a.w, a.h, 14); ctx.stroke();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "34px sans-serif";
    ctx.fillText(o.icone, a.x + 18, a.y + a.h / 2);
    ctx.font = "bold 17px Sora, sans-serif"; ctx.fillStyle = "#ffe08a";
    ctx.fillText(o.nome, a.x + 68, a.y + 36);
    ctx.font = "13px Sora, sans-serif"; ctx.fillStyle = "#9db8a4";
    quebrarTexto(o.desc, a.x + 68, a.y + 62, a.w - 84, 17);
    ctx.textBaseline = "alphabetic";
  });
}

/* ---------- reset ---------- */
function reiniciar() {
  inimigos = []; projeteis = []; particulas = []; efeitos = []; orbes = []; numeros = [];
  p.x = 0; p.y = 0; p.vx = 0; p.vy = 0; p.hp = 100; p.hpMax = 100;
  p.xp = 0; p.nivel = 1; p.xpProx = 12; p.cd = 0; p.superCd = 0; p.inv = 0;
  p.arma = "espada";
  cam.x = 0; cam.y = 0;
  G.run = 0; G.kills = 0; G.over = false; G.shake = 0; G.hitstop = 0;
  spawnT = 0;
  FASE.n = 1; FASE.chefe = null; FASE.proximoEvento = 60;
  FASE.multSpawn = 1; FASE.tetoInimigos = 34; FASE.vitoria = false;
  FASE.aviso = 0; FASE.avisoTxt = "";
  if (typeof resetMeta === "function") resetMeta();
  if (typeof limparAtivos === "function") limparAtivos();
  if (typeof limparExtras === "function") limparExtras();
  p.trilha = [];
}

/* ---------- loop ---------- */
let ultimo = performance.now();
function frame(agora) {
  requestAnimationFrame(frame);
  let dt = (agora - ultimo) / 1000;
  ultimo = agora;
  dt = Math.min(dt, 0.05);          // evita salto após aba inativa
  G.t += dt;

  if (typeof HUB !== "undefined" && HUB.aberto) {
    if (HUB.avisoT > 0) HUB.avisoT -= dt;
    desenharHub();
    return;
  }
  const pausado = (typeof META !== "undefined") && (META.pausa || META.evolucaoPendente);
  if (pausado) {
    // mundo congelado enquanto o jogador escolhe
  } else if (G.hitstop > 0) {        // hit pause: o segredo do "peso"
    G.hitstop -= dt;
  } else if (!G.over) {
    update(dt);
  }
  desenhar();
}
