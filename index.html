/* ----------------------------------------------------------
   SAVE — progresso persistente
---------------------------------------------------------- */
const SAVE_KEY = "combate.progresso.v1";

function saveVazio() {
  return {
    fragmentos: 0,
    maestria: { espada: 0, varinha: 0, martelo: 0 },
    ramo:    { espada: null, varinha: null, martelo: null },   // escolha de tier 2
    final:   { espada: null, varinha: null, martelo: null },   // escolha de tier 3
    escolasAbertas: ["harmonica"],
    supersAbertos: ["acorde"],
    superEquipado: "acorde",
    melhorTempo: 0, melhorNivel: 0, totalKills: 0, runs: 0,
    visto: {},   // ids já vistos (pra destacar novidade)
  };
}

function carregarSave(storage) {
  try {
    const raw = storage.getItem(SAVE_KEY);
    if (!raw) return saveVazio();
    const s = JSON.parse(raw);
    return Object.assign(saveVazio(), s);
  } catch (e) { return saveVazio(); }
}

function gravarSave(storage, s) {
  try { storage.setItem(SAVE_KEY, JSON.stringify(s)); return true; }
  catch (e) { return false; }
}

/* ----------------------------------------------------------
   ESTADO DE MAESTRIA de uma arma
---------------------------------------------------------- */
function estadoArma(save, arma) {
  const m = save.maestria[arma] || 0;
  const ramo = save.ramo[arma];
  const fin = save.final[arma];
  let tier = 1, prox = MAESTRIA.t2, falta = MAESTRIA.t2 - m, pendente = null;

  if (m >= MAESTRIA.t2 && !ramo) pendente = "ramo";
  if (ramo) tier = 2;
  if (tier === 2) {
    prox = MAESTRIA.t3; falta = MAESTRIA.t3 - m;
    if (m >= MAESTRIA.t3 && !fin) pendente = "final";
    if (fin) { tier = 3; falta = 0; prox = null; }
  }
  return {
    tier, maestria: m, prox, falta: Math.max(0, falta), pendente,
    pct: prox ? Math.min(1, m / prox) : 1,
    ramo, final: fin,
  };
}

/* nome/visual atual da arma conforme evolução */
function armaAtual(save, arma) {
  const arv = ARVORES[arma];
  const est = estadoArma(save, arma);
  if (est.final) {
    const f = arv.ramos[est.ramo].finais[est.final];
    return { ...arv.base, nome: f.nome, icone: f.icone, desc: f.desc, regra: f.regra, ramo: est.ramo, final: est.final, tier: 3 };
  }
  if (est.ramo) {
    const r = arv.ramos[est.ramo];
    return { ...arv.base, nome: r.nome, icone: r.icone, cor: r.cor, desc: r.desc, regra: r.regra, ramo: est.ramo, tier: 2 };
  }
  return { ...arv.base, regra: null, tier: 1 };
}

/* opções de evolução disponíveis agora */
function opcoesEvolucao(save, arma) {
  const est = estadoArma(save, arma);
  if (est.pendente === "ramo") return { tipo: "ramo", opcoes: Object.values(ARVORES[arma].ramos) };
  if (est.pendente === "final") return { tipo: "final", opcoes: Object.values(ARVORES[arma].ramos[est.ramo].finais) };
  return null;
}

function escolherEvolucao(save, arma, id) {
  const op = opcoesEvolucao(save, arma);
  if (!op) return false;
  const valido = op.opcoes.some(o => o.id === id);
  if (!valido) return false;
  if (op.tipo === "ramo") save.ramo[arma] = id; else save.final[arma] = id;
  return true;
}

function ganharMaestria(save, arma, dano) {
  const p = dano / MAESTRIA.divisorDano;
  save.maestria[arma] = (save.maestria[arma] || 0) + p;
  return p;
}

/* ----------------------------------------------------------
   RESSONÂNCIA — lê a sequência real do LIFE.
   REGRA DE OURO: só adiciona. Nunca tira nada do jogador.
---------------------------------------------------------- */
function diasDesde(iso, agora) {
  if (!iso) return null;
  const d = Math.floor(((agora || Date.now()) - new Date(iso).getTime()) / 86400000);
  return isNaN(d) ? null : d;
}

/* recebe as linhas da planilha do LIFE e devolve o buff por escola */
function calcularRessonancia(rows, agora) {
  const porCat = {};
  (rows || []).forEach(r => {
    if (!r || r.tipo === "Rotina") return;
    const c = r.categoria;
    if (!c) return;
    if (!porCat[c] || (r.ultimoAvanco || "") > porCat[c]) porCat[c] = r.ultimoAvanco || "";
  });

  const out = {};
  for (const esc of Object.values(ESCOLAS)) {
    const ultimo = porCat[esc.categoria];
    const dias = diasDesde(ultimo, agora);
    // "viva" se avançou hoje ou ontem
    const viva = dias !== null && dias <= 1;
    // sequência aproximada: quanto mais recente, mais forte (o LIFE guarda só o último avanço)
    const forca = viva ? 1 : 0;
    const bonus = viva ? Math.min(esc.ressonancia.teto, esc.ressonancia.porDia * 7 * forca) : 0;
    out[esc.id] = {
      escola: esc.id, nome: esc.nome, icone: esc.icone, cor: esc.cor,
      categoria: esc.categoria, dias, ativa: viva, bonus,
      atributo: esc.ressonancia.atributo, desc: esc.ressonancia.desc,
    };
  }
  return out;
}

/* escolas desbloqueadas pela rotina (só adiciona) */
function escolasDesbloqueadas(save, ressonancia) {
  const novas = [];
  for (const r of Object.values(ressonancia || {})) {
    if (r.ativa && !save.escolasAbertas.includes(r.escola)) {
      save.escolasAbertas.push(r.escola);
      novas.push(r.escola);
    }
  }
  return novas;
}

/* ----------------------------------------------------------
   SORTEIO DE UPGRADES no level-up
---------------------------------------------------------- */
function sortearUpgrades(nivel, jaPegos, escolasAbertas, aleatorio) {
  const rnd = aleatorio || Math.random;
  const pool = MODIFICADORES.filter(m => {
    if (jaPegos.includes(m.id)) return false;
    if (m.raro === 1 && nivel < 6) return false;
    if (m.escola && !(escolasAbertas || []).includes(m.escola)) return false;
    return true;
  });
  const escolhidos = [];
  const copia = [...pool];
  while (escolhidos.length < 3 && copia.length) {
    const i = Math.floor(rnd() * copia.length);
    escolhidos.push(copia.splice(i, 1)[0]);
  }
  return escolhidos;
}

/* supers liberados conforme escolas abertas + marcos */
function supersDisponiveis(save) {
  return Object.values(SUPERS).filter(s =>
    save.escolasAbertas.includes(s.escola) && save.supersAbertos.includes(s.id)
  );
}

/* marcos que liberam supers novos da escola harmônica */
function checarMarcos(save) {
  const novos = [];
  const totalMaestria = Object.values(save.maestria).reduce((a, b) => a + b, 0);
  const marcos = [
    { super: "crescendo", req: () => save.runs >= 5 },
    { super: "silencio",  req: () => totalMaestria >= 8000 },
    { super: "sinfonia",  req: () => Object.values(save.ramo).filter(Boolean).length >= 2 },
  ];
  for (const m of marcos) {
    if (!save.supersAbertos.includes(m.super) && m.req()) {
      save.supersAbertos.push(m.super);
      novos.push(m.super);
    }
  }
  return novos;
}

/* ---------- ressonância: lê a rotina real ---------- */
/* estado da conexão com o LIFE — nunca falhar em silêncio */
function origemInvalida() {
  const p = location.protocol;
  return p === "content:" || p === "file:";
}

async function aplicarRessonancia() {
  let rows = null;
  META.conexao = "carregando";
  META.conexaoDetalhe = "";

  if (!LIFE_API || LIFE_API.indexOf("script.google") < 0) {
    META.conexao = "sem-api";
  } else if (origemInvalida()) {
    META.conexao = "origem";
    META.conexaoDetalhe = "abra pelo GitHub Pages, não pelo arquivo baixado";
  } else {
    try {
      const r = await fetch(LIFE_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "getAll" }),
      });
      const j = await r.json();
      if (j.ok && j.rows) {
        rows = j.rows;
        META.conexao = "ok";
        META.conexaoDetalhe = `${rows.length} linhas lidas`;
      } else {
        META.conexao = "erro";
        META.conexaoDetalhe = j.error || "a planilha respondeu sem dados";
      }
    } catch (e) {
      META.conexao = "erro";
      META.conexaoDetalhe = (e && e.message) ? e.message : "sem conexão";
    }
  }

  META.ressonancia = P.calcularRessonancia(rows || []);
  const novas = P.escolasDesbloqueadas(META.save, META.ressonancia);
  if (novas.length) {
    novas.forEach(n => META.novidades.push({ tipo: "escola", id: n }));
    P.gravarSave(localStorage, META.save);
  }
  atualizarBanner();
}

function bonusEscola(id) {
  const r = META.ressonancia[id];
  return r && r.ativa ? r.bonus : 0;
}

function atualizarBanner() {
  const el = document.getElementById("resson");
  if (!el) return;
  const ativas = Object.values(META.ressonancia).filter(r => r.ativa);
  if (!ativas.length) { el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML = ativas.map(r =>
    `<span style="color:${r.cor}">${r.icone} ${r.nome} +${Math.round(r.bonus*100)}%</span>`
  ).join("");

/* ---------- multiplicadores vindos da progressão ---------- */
function multDano(armaId) {
  let m = 1;
  // ressonância marcial reforça corpo a corpo; arcana reforça projétil
  if (armaId === "espada" || armaId === "martelo") m += bonusEscola("marcial");
  if (armaId === "varinha") m += bonusEscola("arcana");
  // modificadores
  if (META.mod.frenesi) m += Math.min(0.5, META.matouRecente * 0.03);
  if (META.mod.adrenalina && p.hp / p.hpMax < 0.4) m += 0.35;
  // sobrecarga: todo 5º ataque triplica
  return m;
}

function multVelocidade() {
  let v = 1;
  if (META.mod.passoLeve) v += 0.18;
  if (META.mod.adrenalina) v += (1 - p.hp / p.hpMax) * 0.35;
  return v;
}

function multCadencia() {
  let c = 1;
  if (META.mod.frenesi) c += Math.min(0.45, META.matouRecente * 0.025);
  return c;
}

/* ---------- registrar dano p/ maestria ---------- */
function registrarDano(armaId, dano) {
  if (META.danoPorArma[armaId] === undefined) return;
  META.danoPorArma[armaId] += dano;
}

/* ---------- level-up: pausa e oferece 3 cartas ---------- */
function aoSubirNivel() {
  const ops = P.sortearUpgrades(p.nivel, META.modAtivos, META.save.escolasAbertas);
  if (!ops.length) return;
  META.pausa = { tipo: "upgrade" };
  META.cartas = ops;
}

function escolherCarta(i) {
  const c = META.cartas[i];
  if (!c) return;
  META.modAtivos.push(c.id);
  META.mod[c.id] = true;
  aplicarEfeitoImediato(c.id);
  META.pausa = null; META.cartas = [];
  som("nivel");
}

function aplicarEfeitoImediato(id) {
  if (id === "escudo") { META.escudoMax = 30; META.escudo = 30; }
  if (id === "ima") p.raioColeta = 260;
  if (id === "foco") SUPER.cdMax = Math.max(3, SUPER.cdMax * 0.7);
}

/* ---------- fim de run: maestria, fragmentos, evolução ---------- */
function fimDeRun() {
  const s = META.save;
  s.runs++;
  s.totalKills += G.kills;
  s.melhorTempo = Math.max(s.melhorTempo, Math.floor(G.run));
  s.melhorNivel = Math.max(s.melhorNivel, p.nivel);

  for (const arma of ["espada", "varinha", "martelo"]) {
    if (META.danoPorArma[arma] > 0) P.ganharMaestria(s, arma, META.danoPorArma[arma]);
  }
  let frag = Math.floor(G.kills * 0.5 + G.run * 0.3);
  if (META.mod.avareza) frag = Math.floor(frag * 1.6);
  s.fragmentos += frag;
  META.ultimoFrag = frag;

  const novosSupers = P.checarMarcos(s);
  novosSupers.forEach(n => META.novidades.push({ tipo: "super", id: n }));

  P.gravarSave(localStorage, s);

  // há evolução pendente?
  META.evolucaoPendente = null;
  for (const arma of ["espada", "varinha", "martelo"]) {
    const op = P.opcoesEvolucao(s, arma);
    if (op) { META.evolucaoPendente = { arma, ...op }; break; }
  }
}

function confirmarEvolucao(id) {
  const ev = META.evolucaoPendente;
  if (!ev) return;
  P.escolherEvolucao(META.save, ev.arma, id);
  P.gravarSave(localStorage, META.save);
  META.novidades.push({ tipo: "evolucao", arma: ev.arma, id });
  // procura próxima pendente
  META.evolucaoPendente = null;
  for (const arma of ["espada", "varinha", "martelo"]) {
    const op = P.opcoesEvolucao(META.save, arma);
    if (op) { META.evolucaoPendente = { arma, ...op }; break; }
  }
  som("nivel");
}

/* helper: onda que empurra e causa dano */
function ondaDeChoque(x, y, raio, dano, empurrao, cor) {
  efeitos.push({ tipo:"onda", x, y, r:12, rMax:raio, vida:.45, max:.45, cor, grosso:true });
  let n = 0;
  for (const e of inimigos) {
    if (e.morto) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d > raio) continue;
    const ang = Math.atan2(e.y - y, e.x - x);
    bater(e, dano, ang, empurrao);
    n++;
  }
  return n;
}

function inimigoMaisProximo(de) {
  let melhor = null, md = Infinity;
  for (const e of inimigos) {
    if (e.morto) continue;
    const d = dist2(e, de);
    if (d < md) { md = d; melhor = e; }
  }
  return melhor;
}

/* ---------- atualização dos efeitos contínuos ---------- */
function atualizarAtivos(dt) {
  /* congelamento global */
  if (ATIVOS.congelamento > 0) ATIVOS.congelamento -= dt;

  /* dash da investida */
  if (ATIVOS.dash > 0) {
    ATIVOS.dash -= dt;
    const vel = 900;
    p.x += Math.cos(p.dashAng) * vel * dt;
    p.y += Math.sin(p.dashAng) * vel * dt;
    p.inv = Math.max(p.inv, .1);
    particulas.push({ x:p.x, y:p.y, vx:rnd(-40,40), vy:rnd(-40,40), r:rnd(2,5), vida:.3, max:.3, cor:"#ff9c6b" });
    for (const e of inimigos) {
      if (e.morto || (p.dashAtingidos && p.dashAtingidos.includes(e))) continue;
      if (dist2(e, p) < Math.pow(e.r + p.r + 14, 2)) {
        bater(e, 70, p.dashAng, 700);
        e.atordoado = .6;
        (p.dashAtingidos = p.dashAtingidos || []).push(e);
        G.shake = Math.max(G.shake, 8);
      }
    }
  }

  /* pulsos sequenciais (crescendo / terremoto) */
  for (const pu of ATIVOS.pulsos) {
    pu.t -= dt;
    if (pu.t <= 0 && pu.restam > 0) {
      pu.indice++;
      if (pu.tipo === "crescendo") {
        const esc = pu.indice;
        ondaDeChoque(p.x, p.y, 150 + esc * 110, 40 + esc * 35, 400 + esc * 250, "#c9a7ff");
        G.shake = Math.max(G.shake, 5 + esc * 4);
      } else if (pu.tipo === "terremoto") {
        const r = 90 + pu.indice * 75;
        efeitos.push({ tipo:"onda", x:pu.x, y:pu.y, r:r-40, rMax:r, vida:.35, max:.35, cor:"#ff9c6b", grosso:true });
        for (const e of inimigos) {
          if (e.morto) continue;
          const d = Math.hypot(e.x-pu.x, e.y-pu.y);
          if (d > r - 60 && d < r + 20) {
            bater(e, 46, Math.atan2(e.y-pu.y, e.x-pu.x), 380);
            e.atordoado = .4;
          }
        }
        G.shake = Math.max(G.shake, 7);
      }
      pu.restam--;
      pu.t = pu.intervalo;
    }
  }
  ATIVOS.pulsos = ATIVOS.pulsos.filter(x => x.restam > 0);

  /* auras */
  for (const a of ATIVOS.auras) {
    a.t -= dt; a.cd -= dt;
    if (a.segue) { a.x = p.x; a.y = p.y; }
    if (a.tipo === "sinfonia" && a.cd <= 0) {
      ondaDeChoque(a.x, a.y, a.r, 34, 260, "#c9a7ff");
      a.cd = .9;
    }
    if (a.tipo === "florescer" && a.cd <= 0) {
      p.hp = Math.min(p.hpMax, p.hp + 6);
      efeitos.push({ tipo:"anel", x:a.x, y:a.y, r:a.r*.5, rMax:a.r, vida:.4, max:.4, cor:"#7fd858" });
      particulas.push({ x:p.x+rnd(-20,20), y:p.y+rnd(-20,20), vx:0, vy:-50, r:3, vida:.6, max:.6, cor:"#9cff8a" });
      a.cd = 1;
    }
    if (a.tipo === "singularidade") {
      for (const e of inimigos) {
        if (e.morto) continue;
        const d = Math.hypot(e.x-a.x, e.y-a.y);
        if (d < a.r && d > 4) {
          const ang = Math.atan2(a.y-e.y, a.x-e.x);
          const forca = (1 - d/a.r) * 900;
          e.vx += Math.cos(ang) * forca * dt;
          e.vy += Math.sin(ang) * forca * dt;
        }
      }
      if (a.t <= dt) {   // colapso final
        ondaDeChoque(a.x, a.y, 170, 130, 700, "#8be9ff");
        G.shake = 16; G.hitstop = .12;
        efeitos.push({ tipo:"flash", vida:.12, max:.12 });
      }
    }
  }
  ATIVOS.auras = ATIVOS.auras.filter(a => a.t > 0);

  /* torres */
  for (const t of ATIVOS.torres) {
    t.t -= dt; t.cd -= dt;
    if (t.cd <= 0) {
      const alvo = inimigoMaisProximo(t);
      if (alvo && dist2(alvo, t) < 340*340) {
        const ang = Math.atan2(alvo.y-t.y, alvo.x-t.x);
        projeteis.push({ x:t.x, y:t.y, vx:Math.cos(ang)*560, vy:Math.sin(ang)*560, r:6,
          dano:26, vida:1, perfura:1, atingidos:[], cor:"#ffcf6b", knock:140,
          arma:{ shake:.8, hitstop:.015 } });
        t.cd = .45;
      }
    }
  }
  ATIVOS.torres = ATIVOS.torres.filter(t => t.t > 0);

  /* drones */
  for (const d of ATIVOS.drones) {
    d.t -= dt; d.cd -= dt;
    const alvo = inimigoMaisProximo(d);
    if (alvo) {
      const ang = Math.atan2(alvo.y-d.y, alvo.x-d.x);
      d.vx = lerp(d.vx, Math.cos(ang)*300, dt*4);
      d.vy = lerp(d.vy, Math.sin(ang)*300, dt*4);
      if (dist2(d, alvo) < Math.pow(alvo.r + 12, 2) && d.cd <= 0) {
        bater(alvo, 20, ang, 120);
        d.cd = .5;
      }
    } else {
      d.vx = lerp(d.vx, (p.x-d.x)*2, dt*3);
      d.vy = lerp(d.vy, (p.y-d.y)*2, dt*3);
    }
    d.x += d.vx*dt; d.y += d.vy*dt;
  }
  ATIVOS.drones = ATIVOS.drones.filter(d => d.t > 0);
}

/* ---------- desenho dos ativos ---------- */
function desenharAtivos() {
  for (const a of ATIVOS.auras) {
    const alpha = Math.min(1, a.t) * .25;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = a.tipo === "florescer" ? "#7fd858" : a.tipo === "singularidade" ? "#8be9ff" : "#c9a7ff";
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    if (a.tipo === "singularidade") {
      const raio = 26 * (a.t / 2.2) + 8;
      ctx.fillStyle = "#0a0d14";
      ctx.beginPath(); ctx.arc(a.x, a.y, raio, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#8be9ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(a.x, a.y, raio, 0, TAU); ctx.stroke();
    }
  }
  for (const t of ATIVOS.torres) {
    ctx.fillStyle = "#ffcf6b";
    ctx.beginPath(); ctx.arc(t.x, t.y, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = "#0d1210";
    ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, TAU); ctx.fill();
    ctx.globalAlpha = .25; ctx.strokeStyle = "#ffcf6b"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(t.x, t.y, 340, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const d of ATIVOS.drones) {
    ctx.fillStyle = "#ffe08a";
    ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = .3;
    ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (ATIVOS.congelamento > 0) {
    ctx.globalAlpha = Math.min(.16, ATIVOS.congelamento * .08);
    ctx.fillStyle = "#dfe9ff";
    ctx.fillRect(cam.x - W, cam.y - H, W*2, H*2);
    ctx.globalAlpha = 1;
  }
}

/* super equipado atualmente */
function superAtual() {
  const id = (typeof META !== "undefined" && META.save) ? META.save.superEquipado : "acorde";
  const dados = P.SUPERS[id] || P.SUPERS.acorde;
  return { ...dados, impl: IMPL[id] || IMPL.acorde };
}

/* ==========================================================
   REGRAS DE EVOLUÇÃO — o que cada uma das 27 formas
   realmente FAZ no combate.
   ========================================================== */

/* estruturas de apoio criadas pelas regras */
const EXTRAS = {
  fendas: [],     // {x,y,r,t,dano}  — dano contínuo no chão
  orbes: [],      // {ang,dist,cd}   — orbitam o jogador
  feixes: [],     // {x,y,ang,alc,t} — visual do raio contínuo
  ondas: [],      // {x,y,vx,vy,t,dano,volta,atingidos,largura}
  bigornas: [],   // {x,y,vx,vy,t,volta,atingidos}
  raios: [],      // {x,y,t}
  acumulo: { alvo: null, pilha: 0 },
  reducaoDano: 0,
  contadorRaio: 0,
  blindagem: 0,
};

function limparExtras() {
  EXTRAS.fendas = []; EXTRAS.orbes = []; EXTRAS.feixes = [];
  EXTRAS.ondas = []; EXTRAS.bigornas = []; EXTRAS.raios = [];
  EXTRAS.acumulo = { alvo: null, pilha: 0 };
  EXTRAS.contadorRaio = 0; EXTRAS.blindagem = 0; EXTRAS.reducaoDano = 0;
}

/* qual regra está ativa nesta arma */
function regraDe(armaId) {
  if (typeof META === "undefined" || !META.save) return null;
  const a = P.armaAtual(META.save, armaId);
  return a.regra || null;
}

/* ---------- helpers ---------- */
function alvosNoArco(p, ang, alcance, arco, extra) {
  const lista = [];
  for (const e of inimigos) {
    if (e.morto) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d > alcance + e.r) continue;
    if (arco >= TAU - .01) { lista.push(e); continue; }
    let da = Math.atan2(e.y - p.y, e.x - p.x) - ang;
    while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    if (Math.abs(da) <= arco / 2) lista.push(e);
  }
  return lista;
}

function criarOnda(x, y, ang, dano, opts) {
  const o = opts || {};
  EXTRAS.ondas.push({
    x, y, vx: Math.cos(ang) * (o.vel || 560), vy: Math.sin(ang) * (o.vel || 560),
    t: o.t || 0.75, dano, atingidos: [], volta: !!o.volta, voltando: false,
    origem: { x, y }, largura: o.largura || 26, cor: o.cor || "#b9d4ff",
    deixaFenda: !!o.deixaFenda,
  });
}

function criarFenda(x, y, dano) {
  EXTRAS.fendas.push({ x, y, r: 34, t: 3.2, dano, cd: 0 });
}

function raioNoAlvo(alvo, dano, salta) {
  if (!alvo || alvo.morto) return;
  EXTRAS.raios.push({ x: alvo.x, y: alvo.y, t: .22 });
  bater(alvo, dano, rnd(0, TAU), 220, "martelo");
  G.shake = Math.max(G.shake, 6);
  if (salta) {
    let melhor = null, md = 220 * 220;
    for (const e of inimigos) {
      if (e.morto || e === alvo) continue;
      const d = dist2(e, alvo);
      if (d < md) { md = d; melhor = e; }
    }
    if (melhor) {
      EXTRAS.raios.push({ x: melhor.x, y: melhor.y, t: .2 });
      bater(melhor, dano * .7, rnd(0, TAU), 160, "martelo");
    }
  }
}

/* ==========================================================
   ESPADA
   ========================================================== */
function atacarEspada(p, arma) {
  const regra = regraDe("espada");
  const cor = arma.cor;
  let arco = arma.arco, alcance = arma.alcance, dano = arma.dano, knock = arma.knock;
  let angulos = [p.mira];

  /* —— tier 2 —— */
  if (regra === "arcoDuplo" || regra === "puxaAoCentro" || regra === "giroContinuo" || regra === "golpeEco") {
    angulos = [p.mira, p.mira + Math.PI];          // frente e costas
    dano *= .85;
  }
  if (regra === "arco360" || regra === "danoPorAlvo" || regra === "sucao" || regra === "executar") {
    arco = TAU; alcance *= 1.05; dano *= 1.1;      // gira inteiro
  }
  if (regra === "ondaCortante" || regra === "bumerangue" || regra === "leque3" || regra === "fenda") {
    // dispara onda à distância
    const leque = regra === "leque3" ? [-.28, 0, .28] : [0];
    for (const off of leque) {
      criarOnda(p.x, p.y, p.mira + off, dano * .9, {
        cor, volta: regra === "bumerangue", deixaFenda: regra === "fenda", vel: 620,
      });
    }
    som("swing");
    return;
  }

  /* —— aplica os arcos —— */
  let acertou = 0, alvosTotais = [];
  for (const ang of angulos) {
    efeitos.push({ tipo:"arco", x:p.x, y:p.y, ang, r:alcance, arco:Math.min(arco, 2.9), vida:.16, max:.16, cor });
    const alvos = alvosNoArco(p, ang, alcance, arco);
    alvosTotais = alvosTotais.concat(alvos);
  }
  // remove duplicados (arco 360 pode repetir)
  alvosTotais = [...new Set(alvosTotais)];

  /* —— tier 3: modificadores de dano —— */
  let mult = 1;
  if (regra === "danoPorAlvo") mult = 1 + Math.min(1.4, alvosTotais.length * 0.22);   // ceifa

  for (const e of alvosTotais) {
    const ang = Math.atan2(e.y - p.y, e.x - p.x);
    /* execução: mata quem está fraco */
    if (regra === "executar" && e.hp <= e.hpMax * 0.22) {
      bater(e, e.hp, ang, knock, "espada");
      efeitos.push({ tipo:"onda", x:e.x, y:e.y, r:6, rMax:56, vida:.25, max:.25, cor:"#ff6b6b" });
      acertou++; continue;
    }
    bater(e, dano * mult, ang, knock, "espada");
    /* tesoura: puxa pro centro em vez de empurrar */
    if (regra === "puxaAoCentro") { e.vx -= Math.cos(ang) * knock * 1.6; e.vy -= Math.sin(ang) * knock * 1.6; }
    /* gravitica: sucção contínua */
    if (regra === "sucao") { e.vx -= Math.cos(ang) * knock * 1.9; e.vy -= Math.sin(ang) * knock * 1.9; }
    /* gêmeas: segundo golpe automático */
    if (regra === "golpeEco") { bater(e, dano * .55, ang, knock * .4, "espada"); }
    acertou++;
  }

  if (acertou) {
    G.shake = Math.max(G.shake, arma.shake + acertou);
    G.hitstop = Math.max(G.hitstop, arma.hitstop);
  }
  som(acertou ? "hit" : "swing");
}

/* turbilhão: ataca sozinho enquanto anda */
function turbilhaoTick(dt) {
  if (regraDe("espada") !== "giroContinuo") return;
  if (p.arma !== "espada") return;
  p.giroT = (p.giroT || 0) + dt;
  if (p.giroT < .28) return;
  p.giroT = 0;
  const arma = ARMAS.espada;
  const alvos = alvosNoArco(p, 0, arma.alcance * .95, TAU);
  efeitos.push({ tipo:"anel", x:p.x, y:p.y, r:arma.alcance*.5, rMax:arma.alcance*.95, vida:.2, max:.2, cor:arma.cor });
  for (const e of alvos) {
    const ang = Math.atan2(e.y - p.y, e.x - p.x);
    bater(e, arma.dano * .5, ang, arma.knock * .6, "espada");
  }
  if (alvos.length) G.shake = Math.max(G.shake, 2);
}

/* ==========================================================
   VARINHA
   ========================================================== */
function atacarVarinha(p, arma) {
  const regra = regraDe("varinha");
  const cor = arma.cor;

  /* —— feixe contínuo (raio) —— */
  if (regra === "feixe" || regra === "ricochete" || regra === "reflete" || regra === "acumula") {
    const alc = 520;
    EXTRAS.feixes.push({ x:p.x, y:p.y, ang:p.mira, alc, t:.14, cor });
    let atingidos = [];
    for (const e of inimigos) {
      if (e.morto) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      const proj = dx * Math.cos(p.mira) + dy * Math.sin(p.mira);
      if (proj < 0 || proj > alc) continue;
      const perp = Math.abs(-dx * Math.sin(p.mira) + dy * Math.cos(p.mira));
      if (perp > e.r + 12) continue;
      atingidos.push(e);
    }
    let dano = arma.dano * 1.5;
    /* desintegrar: acumula no mesmo alvo */
    if (regra === "acumula") {
      const primeiro = atingidos[0];
      if (primeiro && EXTRAS.acumulo.alvo === primeiro) EXTRAS.acumulo.pilha = Math.min(12, EXTRAS.acumulo.pilha + 1);
      else { EXTRAS.acumulo.alvo = primeiro; EXTRAS.acumulo.pilha = 0; }
      dano *= 1 + EXTRAS.acumulo.pilha * 0.22;
    }
    for (const e of atingidos) bater(e, dano, p.mira, arma.knock, "varinha");
    /* corrente: salta para vizinhos */
    if (regra === "ricochete" && atingidos.length) {
      const base = atingidos[atingidos.length - 1];
      let saltos = 0, atual = base;
      const usados = new Set(atingidos);
      while (saltos < 3) {
        let melhor = null, md = 190 * 190;
        for (const e of inimigos) {
          if (e.morto || usados.has(e)) continue;
          const d = dist2(e, atual);
          if (d < md) { md = d; melhor = e; }
        }
        if (!melhor) break;
        EXTRAS.feixes.push({ x:atual.x, y:atual.y, ang:Math.atan2(melhor.y-atual.y, melhor.x-atual.x),
          alc:Math.hypot(melhor.x-atual.x, melhor.y-atual.y), t:.14, cor });
        bater(melhor, dano * .7, 0, 60, "varinha");
        usados.add(melhor); atual = melhor; saltos++;
      }
    }
    /* refração: ao atingir, o feixe se parte em direção aos 2 inimigos
       mais próximos que estavam fora da linha original */
    if (regra === "reflete" && atingidos.length) {
      const base = atingidos[atingidos.length - 1];
      const fora = inimigos
        .filter(e => !e.morto && !atingidos.includes(e) && dist2(e, base) < 320*320)
        .sort((a,b) => dist2(a, base) - dist2(b, base))
        .slice(0, 2);
      for (const alvo of fora) {
        const a2 = Math.atan2(alvo.y - base.y, alvo.x - base.x);
        EXTRAS.feixes.push({ x:base.x, y:base.y, ang:a2,
          alc:Math.hypot(alvo.x-base.x, alvo.y-base.y), t:.14, cor });
        bater(alvo, dano * .75, a2, arma.knock, "varinha");
      }
    }
    if (atingidos.length) { G.shake = Math.max(G.shake, 2); G.hitstop = Math.max(G.hitstop, .02); }
    som("magia");
    return;
  }

  /* —— orbitais —— */
  if (regra === "orbita" || regra === "bloqueia" || regra === "orbeAtira" || regra === "orbeExplode") {
    if (EXTRAS.orbes.length < 4) {
      EXTRAS.orbes.push({ ang: rnd(0, TAU), dist: 78, cd: 0, regra });
    }
    som("magia");
    return;
  }

  /* —— projéteis —— */
  let angulos = [p.mira];
  if (regra === "tiroTriplo" || regra === "efeitosVariados" || regra === "divide")
    angulos = [p.mira - .22, p.mira, p.mira + .22];
  if (regra === "converge") angulos = [p.mira - .30, p.mira, p.mira + .30];

  angulos.forEach((a, i) => {
    projeteis.push({
      x: p.x + Math.cos(a) * 22, y: p.y + Math.sin(a) * 22,
      vx: Math.cos(a) * arma.vel, vy: Math.sin(a) * arma.vel,
      r: 7, dano: arma.dano * (angulos.length > 1 ? .8 : 1), vida: 1.4,
      perfura: 4, atingidos: [], cor, knock: arma.knock, arma,
      regra, indice: i,
      converge: regra === "converge" ? { alvoAng: p.mira, t: 0 } : null,
    });
  });
  som("magia");
  p.recuo = 0.10;
}

/* orbes orbitais */
function orbesTick(dt) {
  // anel de guarda: blindagem proporcional ao nº de orbes
  if (EXTRAS.orbes.length && EXTRAS.orbes[0].regra === "bloqueia") {
    EXTRAS.reducaoDano = Math.min(.5, EXTRAS.orbes.length * .13);
  } else EXTRAS.reducaoDano = 0;
  for (const o of EXTRAS.orbes) {
    o.ang += dt * 2.4;
    o.cd -= dt;
    const ox = p.x + Math.cos(o.ang) * o.dist;
    const oy = p.y + Math.sin(o.ang) * o.dist;
    o.x = ox; o.y = oy;
    for (const e of inimigos) {
      if (e.morto) continue;
      if (Math.hypot(e.x - ox, e.y - oy) < e.r + 9 && o.cd <= 0) {
        bater(e, 16, Math.atan2(e.y - oy, e.x - ox), 180, "varinha");
        o.cd = .35;
        if (o.regra === "orbeExplode") {
          efeitos.push({ tipo:"onda", x:ox, y:oy, r:6, rMax:70, vida:.25, max:.25, cor:"#a9c8ff" });
          for (const q of inimigos) {
            if (!q.morto && dist2(q, {x:ox,y:oy}) < 70*70) bater(q, 14, 0, 90, "varinha");
          }
        }
      }
    }
    if (o.regra === "orbeAtira" && o.cd <= -.6) {
      const alvo = inimigoMaisProximo({ x:ox, y:oy });
      if (alvo && dist2(alvo, {x:ox,y:oy}) < 300*300) {
        const a = Math.atan2(alvo.y - oy, alvo.x - ox);
        projeteis.push({ x:ox, y:oy, vx:Math.cos(a)*520, vy:Math.sin(a)*520, r:5, dano:12,
          vida:.9, perfura:1, atingidos:[], cor:"#a9c8ff", knock:80, arma:{shake:.6,hitstop:.01} });
        o.cd = .1;
      }
    }
    /* anel de guarda: cada orbe reduz o dano recebido */

  }
}

/* ==========================================================
   MARTELO
   ========================================================== */
function atacarMartelo(p, arma) {
  const regra = regraDe("martelo");
  const cor = arma.cor;
  const ang = p.mira;

  /* —— arremesso (bigorna) —— */
  if (regra === "arremesso" || regra === "quedaArea" || regra === "arrasta" || regra === "blindaAoJogar") {
    if (regra === "blindaAoJogar") EXTRAS.blindagem = 1.6;
    if (regra === "quedaArea") {
      // cai do céu onde há mais inimigos
      let melhor = { x: p.x + Math.cos(ang) * 150, y: p.y + Math.sin(ang) * 150 }, maxN = -1;
      for (const e of inimigos) {
        if (e.morto) continue;
        let n = 0;
        for (const o of inimigos) if (!o.morto && dist2(o, e) < 90*90) n++;
        if (n > maxN) { maxN = n; melhor = { x: e.x, y: e.y }; }
      }
      EXTRAS.bigornas.push({ x: melhor.x, y: melhor.y - 420, vx: 0, vy: 1500, t: .5,
        alvo: melhor, queda: true, atingidos: [] });
    } else {
      EXTRAS.bigornas.push({ x:p.x, y:p.y, vx:Math.cos(ang)*680, vy:Math.sin(ang)*680,
        t: .95, volta: true, voltando: false, atingidos: [], arrasta: regra === "arrasta" });
    }
    som("pesado");
    return;
  }

  /* —— raio (trovão) —— */
  if (regra === "raioCai" || regra === "raioAuto" || regra === "raioSalta" || regra === "raioMaior") {
    const alvo = inimigoMaisProximo(p);
    if (alvo) {
      EXTRAS.contadorRaio++;
      let dano = arma.dano;
      let gigante = false;
      if (regra === "raioMaior" && EXTRAS.contadorRaio % 10 === 0) { dano *= 3.2; gigante = true; }
      raioNoAlvo(alvo, dano, regra === "raioSalta");
      if (gigante) {
        efeitos.push({ tipo:"onda", x:alvo.x, y:alvo.y, r:10, rMax:180, vida:.4, max:.4, cor:"#ffe08a", grosso:true });
        for (const e of inimigos) {
          if (!e.morto && dist2(e, alvo) < 180*180) bater(e, dano*.4, Math.atan2(e.y-alvo.y, e.x-alvo.x), 400, "martelo");
        }
        G.shake = 14; G.hitstop = .1;
      }
    }
    som("pesado");
    return;
  }

  /* —— golpe normal / sísmico —— */
  const alvos = alvosNoArco(p, ang, arma.alcance, arma.arco);
  efeitos.push({ tipo:"arco", x:p.x, y:p.y, ang, r:arma.alcance, arco:arma.arco, vida:.26, max:.26, cor, grosso:true });

  let acertou = 0;
  for (const e of alvos) {
    const a = Math.atan2(e.y - p.y, e.x - p.x);
    let dano = arma.dano;
    /* colapso: dobro em atordoado */
    if (regra === "puneAtordoado" && (e.atordoado > 0 || e.congelado > 0)) dano *= 2;
    bater(e, dano, a, arma.knock, "martelo");
    e.atordoado = 0.5;
    acertou++;
  }

  /* ondas de choque do sísmico */
  if (regra === "ondaChoque" || regra === "fendaChao" || regra === "tremorDuplo" || regra === "puneAtordoado") {
    const px = p.x + Math.cos(ang) * 60, py = p.y + Math.sin(ang) * 60;
    const tremor = (atraso) => {
      efeitos.push({ tipo:"onda", x:px, y:py, r:10, rMax:130, vida:.32, max:.32, cor });
      for (const e of inimigos) {
        if (e.morto) continue;
        if (dist2(e, {x:px,y:py}) < 130*130) {
          bater(e, arma.dano * .45, Math.atan2(e.y-py, e.x-px), 300, "martelo");
        }
      }
    };
    tremor(0);
    if (regra === "tremorDuplo") ATIVOS.pulsos.push({ x:px, y:py, t:.25, restam:1, intervalo:.25, indice:1, tipo:"terremoto" });
    if (regra === "fendaChao") criarFenda(px, py, arma.dano * .22);
    G.shake = Math.max(G.shake, arma.shake);
  }

  if (acertou) { G.shake = Math.max(G.shake, arma.shake); G.hitstop = Math.max(G.hitstop, arma.hitstop); }
  som(acertou ? "pesado" : "swing");
}

/* tempestade: raios caem sozinhos */
function tempestadeTick(dt) {
  if (regraDe("martelo") !== "raioAuto") return;
  p.tempT = (p.tempT || 0) + dt;
  if (p.tempT < 1.4) return;
  p.tempT = 0;
  const vivos = inimigos.filter(e => !e.morto);
  if (!vivos.length) return;
  raioNoAlvo(vivos[Math.floor(Math.random() * vivos.length)], ARMAS.martelo.dano * .55, false);
}

/* ==========================================================
   ATUALIZAÇÃO DOS EXTRAS
   ========================================================== */
function atualizarExtras(dt) {
  turbilhaoTick(dt);
  tempestadeTick(dt);
  orbesTick(dt);

  if (EXTRAS.blindagem > 0) { EXTRAS.blindagem -= dt; p.inv = Math.max(p.inv, .05); }

  /* fendas no chão */
  for (const f of EXTRAS.fendas) {
    f.t -= dt; f.cd -= dt;
    if (f.cd <= 0) {
      f.cd = .35;
      for (const e of inimigos) {
        if (!e.morto && dist2(e, f) < f.r * f.r) bater(e, f.dano, rnd(0, TAU), 40, "espada");
      }
    }
  }
  EXTRAS.fendas = EXTRAS.fendas.filter(f => f.t > 0);

  /* ondas cortantes */
  for (const o of EXTRAS.ondas) {
    o.t -= dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.volta && !o.voltando && o.t < .38) { o.voltando = true; o.vx *= -1; o.vy *= -1; o.atingidos = []; }
    for (const e of inimigos) {
      if (e.morto || o.atingidos.includes(e)) continue;
      if (dist2(e, o) < Math.pow(e.r + o.largura, 2)) {
        bater(e, o.dano, Math.atan2(o.vy, o.vx), 200, "espada");
        o.atingidos.push(e);
      }
    }
    if (o.deixaFenda) {
      o.fendaT = (o.fendaT || 0) + dt;
      if (o.fendaT > .12) { o.fendaT = 0; criarFenda(o.x, o.y, o.dano * .18); }
    }
  }
  EXTRAS.ondas = EXTRAS.ondas.filter(o => o.t > 0);

  /* feixes (só visual, o dano é instantâneo) */
  for (const f of EXTRAS.feixes) f.t -= dt;
  EXTRAS.feixes = EXTRAS.feixes.filter(f => f.t > 0);

  /* raios */
  for (const r of EXTRAS.raios) r.t -= dt;
  EXTRAS.raios = EXTRAS.raios.filter(r => r.t > 0);

  /* bigornas */
  for (const b of EXTRAS.bigornas) {
    b.t -= dt;
    if (b.queda) {
      b.y += b.vy * dt;
      if (b.y >= b.alvo.y) {
        b.y = b.alvo.y;
        if (!b.explodiu) {
          b.explodiu = true;
          G.shake = 15; G.hitstop = .1;
          efeitos.push({ tipo:"onda", x:b.x, y:b.y, r:10, rMax:150, vida:.4, max:.4, cor:"#e8c07a", grosso:true });
          for (const e of inimigos) {
            if (!e.morto && dist2(e, b) < 150*150)
              bater(e, ARMAS.martelo.dano * 1.1, Math.atan2(e.y-b.y, e.x-b.x), 620, "martelo");
          }
        }
      }
    } else {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.volta && !b.voltando && b.t < .48) { b.voltando = true; b.atingidos = []; }
      if (b.voltando) {
        const a = Math.atan2(p.y - b.y, p.x - b.x);
        b.vx = Math.cos(a) * 760; b.vy = Math.sin(a) * 760;
      }
      for (const e of inimigos) {
        if (e.morto || b.atingidos.includes(e)) continue;
        if (dist2(e, b) < Math.pow(e.r + 20, 2)) {
          bater(e, ARMAS.martelo.dano * .8, Math.atan2(b.vy, b.vx), 420, "martelo");
          b.atingidos.push(e);
          if (b.arrasta && b.voltando) { e.vx += (p.x - e.x) * 3.2; e.vy += (p.y - e.y) * 3.2; }
        }
      }
    }
  }
  EXTRAS.bigornas = EXTRAS.bigornas.filter(b => b.t > 0);

  /* projéteis que convergem ou dividem */
  for (const b of projeteis) {
    if (b.converge) {
      b.converge.t += dt;
      const a = Math.atan2(b.vy, b.vx);
      const alvoA = b.converge.alvoAng;
      let da = alvoA - a;
      while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      const na = a + da * Math.min(1, dt * 5);
      const v = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * v; b.vy = Math.sin(na) * v;
    }
  }
}

/* divisão de projéteis ao acertar (chamado do combate) */
function aoProjetilAcertar(b, e) {
  if (b.regra === "divide" && !b.jaDividiu) {
    b.jaDividiu = true;
    for (const off of [-.6, .6, Math.PI]) {
      const a = Math.atan2(b.vy, b.vx) + off;
      projeteis.push({ x:b.x, y:b.y, vx:Math.cos(a)*520, vy:Math.sin(a)*520, r:5,
        dano:b.dano*.75, vida:.8, perfura:2, atingidos:[e], cor:b.cor, knock:60, arma:b.arma });
    }
  }
  if (b.regra === "efeitosVariados") {
    if (b.indice === 0) e.lento = 1.2;                       // gelo
    if (b.indice === 1) { e.veneno = 2.5; e.venenoDano = b.dano * .1; }  // veneno
    if (b.indice === 2) e.atordoado = Math.max(e.atordoado || 0, .35);   // atordoa
  }
}

/* ---------- desenho dos extras ---------- */
function desenharExtras() {
  /* fendas */
  for (const f of EXTRAS.fendas) {
    ctx.globalAlpha = Math.min(.5, f.t * .3);
    ctx.fillStyle = "#ff9c6b";
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffcf6b"; ctx.lineWidth = 1.5;
    ctx.globalAlpha = Math.min(.8, f.t * .4);
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* ondas cortantes */
  for (const o of EXTRAS.ondas) {
    const a = Math.atan2(o.vy, o.vx);
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(a);
    ctx.globalAlpha = Math.min(1, o.t * 2);
    ctx.fillStyle = o.cor;
    ctx.beginPath(); ctx.ellipse(0, 0, 10, o.largura, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }
  /* feixes */
  for (const f of EXTRAS.feixes) {
    ctx.globalAlpha = Math.min(1, f.t * 7);
    ctx.strokeStyle = f.cor; ctx.lineWidth = 7 * Math.min(1, f.t * 7);
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(f.x, f.y);
    ctx.lineTo(f.x + Math.cos(f.ang) * f.alc, f.y + Math.sin(f.ang) * f.alc);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineCap = "butt";
  }
  /* raios */
  for (const r of EXTRAS.raios) {
    ctx.globalAlpha = Math.min(1, r.t * 5);
    ctx.strokeStyle = "#ffe08a"; ctx.lineWidth = 4;
    ctx.beginPath();
    let x = r.x, y = r.y - 300;
    ctx.moveTo(x, y);
    for (let i = 0; i < 6; i++) { x += rnd(-16, 16); y += 50; ctx.lineTo(x, y); }
    ctx.lineTo(r.x, r.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* orbes */
  for (const o of EXTRAS.orbes) {
    ctx.fillStyle = "#a9c8ff";
    ctx.beginPath(); ctx.arc(o.x || p.x, o.y || p.y, 8, 0, TAU); ctx.fill();
    ctx.globalAlpha = .3;
    ctx.beginPath(); ctx.arc(o.x || p.x, o.y || p.y, 14, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* bigornas */
  for (const b of EXTRAS.bigornas) {
    ctx.fillStyle = "#e8c07a";
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(G.t * 9);
    ctx.fillRect(-13, -10, 26, 20);
    ctx.restore();
  }
  /* blindagem */
  if (EXTRAS.blindagem > 0) {
    ctx.strokeStyle = "#ffcf6b"; ctx.lineWidth = 3;
    ctx.globalAlpha = Math.min(.9, EXTRAS.blindagem);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 9, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function visualSave() {
  const s = META.save;
  if (!s.visual) s.visual = { corpo:"circulo", cor:"osso", rastro:"nenhum", comprados:["circulo","osso","nenhum"] };
  return s.visual;
}

function temItem(id) { return visualSave().comprados.includes(id); }

function comprarOuEquipar(cat, item) {
  const v = visualSave();
  if (!temItem(item.id)) {
    if (META.save.fragmentos < item.custo) { avisar("fragmentos insuficientes"); return; }
    META.save.fragmentos -= item.custo;
    v.comprados.push(item.id);
    avisar(`${item.nome} desbloqueado!`);

function corDoJogador(t) {
  const v = visualSave();

  if (!c) return "#eaf6ff";
  if (c.cor === "aurora") {
    const h = (t * 40) % 360;
    return `hsl(${h}, 85%, 72%)`;
  }
  return c.cor;
}
function formaDoJogador() {

}

/* ---------- desenho de formas ---------- */
function desenharForma(cx, cy, r, forma) {
  ctx.beginPath();
  if (forma === "circulo") { ctx.arc(cx, cy, r, 0, TAU); }
  else if (forma === "quadrado") { ctx.rect(cx-r*.86, cy-r*.86, r*1.72, r*1.72); }
  else if (forma === "losango") {
    ctx.moveTo(cx, cy-r*1.15); ctx.lineTo(cx+r*.95, cy); ctx.lineTo(cx, cy+r*1.15); ctx.lineTo(cx-r*.95, cy);
  }
  else if (forma === "triangulo") {
    ctx.moveTo(cx+r*1.15, cy); ctx.lineTo(cx-r*.8, cy-r*.95); ctx.lineTo(cx-r*.8, cy+r*.95);
  }
  else if (forma === "hexagono") {
    for (let i=0;i<6;i++){ const a=(i/6)*TAU; const px=cx+Math.cos(a)*r*1.05, py=cy+Math.sin(a)*r*1.05;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  }
  else if (forma === "estrela") {
    for (let i=0;i<10;i++){ const a=(i/10)*TAU - Math.PI/2; const rr = i%2 ? r*.52 : r*1.25;
      const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  }
  ctx.closePath();
  ctx.fill();
}

/* ==========================================================
   DESENHO DO HUB
   ========================================================== */
function desenharHub() {
  HUB.toques = [];
  ctx.fillStyle = "#0b0f0e";
  ctx.fillRect(0, 0, W, H);

  /* topo: fragmentos */
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffcf6b"; ctx.font = "bold 15px Sora, sans-serif";
  ctx.fillText(`💎 ${META.save.fragmentos}`, 18, 32);
  ctx.textAlign = "right";
  ctx.fillStyle = "#7d8f7f"; ctx.font = "12px Sora, sans-serif";
  ctx.fillText(`${META.save.runs} runs · recorde ${META.save.melhorTempo}s`, W - 18, 32);

  /* abas */
  const abaY = 50, abaH = 34;
  const larg = (W - 24) / HUB.abas.length;
  HUB.abas.forEach((nome, i) => {
    const x = 12 + i * larg;
    const sel = HUB.aba === i;
    ctx.fillStyle = sel ? "rgba(127,216,88,.16)" : "rgba(255,255,255,.04)";
    ctx.beginPath(); ctx.roundRect(x+2, abaY, larg-4, abaH, 9); ctx.fill();
    if (sel) { ctx.strokeStyle = "#7fd858"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.roundRect(x+2, abaY, larg-4, abaH, 9); ctx.stroke(); }
    ctx.fillStyle = sel ? "#7fd858" : "#8a9d8f";
    ctx.font = `${sel?"bold ":""}11px Sora, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(nome, x + larg/2, abaY + abaH/2);
    HUB.toques.push({ x:x, y:abaY, w:larg, h:abaH, fn:()=>{ HUB.aba=i; HUB.scroll=0; som("xp"); } });
  });
  ctx.textBaseline = "alphabetic";

  /* conteúdo com recorte e rolagem */
  const topo = abaY + abaH + 14;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, topo, W, H - topo); ctx.clip();
  ctx.translate(0, -HUB.scroll);
  const y = topo + 6;
  let fim = y;
  if (HUB.aba === 0) fim = abaJogar(y);
  if (HUB.aba === 1) fim = abaEscolas(y);
  if (HUB.aba === 2) fim = abaPoderes(y);
  if (HUB.aba === 3) fim = abaArmas(y);
  if (HUB.aba === 4) fim = abaVisual(y);
  ctx.restore();
  HUB.scrollMax = Math.max(0, fim - H + 30);

  /* aviso flutuante */
  if (HUB.avisoT > 0) {
    ctx.globalAlpha = Math.min(1, HUB.avisoT);
    ctx.fillStyle = "rgba(20,26,20,.95)";
    ctx.beginPath(); ctx.roundRect(W/2-130, H-96, 260, 38, 10); ctx.fill();
    ctx.strokeStyle = "#7fd858"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(W/2-130, H-96, 260, 38, 10); ctx.stroke();
    ctx.fillStyle = "#cfe0d2"; ctx.font = "13px Sora, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(HUB.aviso, W/2, H-77);
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  }
}

/* helper de cartão */
function cartao(x, y, w, h, corBorda, preenche) {
  ctx.fillStyle = preenche || "rgba(255,255,255,.045)";
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
  if (corBorda) { ctx.strokeStyle = corBorda; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.stroke(); }
}
function toqueVisivel(x, y, w, h, fn) {
  HUB.toques.push({ x, y:y - HUB.scroll, w, h, fn, rolavel:true });
}

/* ——— ABA JOGAR ——— */
function abaJogar(y) {

    y += h + 10;

    cartao(M, y, w, 38, "rgba(255,255,255,.16)");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

  if (!ativas.length) {
    cartao(M, y, w, 54);
    ctx.fillStyle = "#8a9d8f"; ctx.font = "12px Sora, sans-serif";

  return y;

function grupoVisual(titulo, itens, cat, y, pintar) {
  const M = 18, w = W - M*2;
  ctx.textAlign = "left"; ctx.fillStyle = "#7d8f7f"; ctx.font = "11px Sora, sans-serif";
  ctx.fillText(titulo, M, y); y += 10;
  const porLinha = 4, s = (w - (porLinha-1)*8) / porLinha;
  itens.forEach((item, i) => {
    const col = i % porLinha, lin = Math.floor(i / porLinha);
    const x = M + col * (s + 8), yy = y + lin * (s + 26);
    const equip = visualSave()[cat] === item.id;
    const tem = temItem(item.id);
    cartao(x, yy, s, s, equip ? "#7fd858" : (tem ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.06)"),
           equip ? "rgba(127,216,88,.14)" : "rgba(255,255,255,.04)");
    pintar(item, x, yy, s);
    ctx.textAlign = "center";
    ctx.font = "9px Sora, sans-serif";
    ctx.fillStyle = equip ? "#7fd858" : "#7d8f7f";
    ctx.fillText(item.nome, x + s/2, yy + s - 6);
    if (!tem) {
      ctx.fillStyle = META.save.fragmentos >= item.custo ? "#ffcf6b" : "#6f6a52";
      ctx.font = "bold 9px Sora, sans-serif";
      ctx.fillText(`💎${item.custo}`, x + s/2, yy + s + 12);
    }
    ctx.textAlign = "left";
    toqueVisivel(x, yy, s, s, () => comprarOuEquipar(cat, item));
  });
  const linhas = Math.ceil(itens.length / porLinha);
  return y + linhas * (s + 26) + 12;
}

function textoQuebrado(txt, x, y, larg, lh) {
  const palavras = String(txt).split(" ");
  let linha = "", ly = y;
  for (const w of palavras) {
    const t = linha ? linha + " " + w : w;
    if (ctx.measureText(t).width > larg && linha) { ctx.fillText(linha, x, ly); linha = w; ly += lh; }
    else linha = t;
  }
  if (linha) { ctx.fillText(linha, x, ly); ly += lh; }
  return ly;
}

/* ---------- interação do hub ---------- */
let hubArraste = null;
function hubDown(q) {
  hubArraste = { y:q.y, scroll:HUB.scroll, moveu:false };
}
function hubMove(q) {
  if (!hubArraste) return;
  const d = q.y - hubArraste.y;
  if (Math.abs(d) > 6) hubArraste.moveu = true;
  HUB.scroll = Math.max(0, Math.min(HUB.scrollMax, hubArraste.scroll - d));
}
function hubUp(q) {
  if (!hubArraste) return;
  const moveu = hubArraste.moveu;
  hubArraste = null;
  if (moveu) return;
  for (const t of HUB.toques) {
    if (q.x >= t.x && q.x <= t.x + t.w && q.y >= t.y && q.y <= t.y + t.h) { t.fn(); return; }
  }
}
